name: Auto Assign PR and Request Reviewers

on:
  pull_request:
    types: [opened]

jobs:
  configurar-pr:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Auto Assign PR and Request Reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const prOwner = context.payload.pull_request.user.login;

            // 1. List of all developers
            const listOfAllDevelopers = ['ihFernando'];

            // 2. Auto-assign the PR to its creator
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [prOwner]
            });

            // 3. Filter the list to NOT include the PR creator as a reviewer
            const reviewers = listOfAllDevelopers.filter(dev => dev !== prOwner);

            // 4. Request reviews from all other developers individually
            if (reviewers.length > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: reviewers
              });
            }
